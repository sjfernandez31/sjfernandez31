<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 18" width="800" height="18" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono','Liberation Mono',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#00ff9c"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#070b14"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowS" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect x="0" y="0" width="800" height="18" rx="14"/></clipPath>
<linearGradient id="dv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.8"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#clip)">

<rect x="0" y="8" width="800" height="2" fill="url(#dv)"/>
<circle r="3.5" cy="9" fill="#fff" filter="url(#glowS)"><animate attributeName="cx" from="-10" to="810" dur="4.5s" repeatCount="indefinite"/></circle>
<path d="M395.0,9 l5,-5 l5,5 l-5,5 z" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
</g>

</svg>
